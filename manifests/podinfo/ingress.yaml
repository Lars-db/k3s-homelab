apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: podinfo
  namespace: demo
  labels:
    app.kubernetes.io/name: podinfo
spec:
  # Traefik ships with k3s as the default ingress controller.
  ingressClassName: traefik
  rules:
    # NOTE: avoid .local -- Chromium browsers (Chrome/Brave/Edge) resolve
    # .local hostnames via mDNS/Bonjour instead of /etc/hosts, which breaks
    # local testing. .test is the IANA-reserved TLD for this purpose.
    - host: podinfo.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: podinfo
                port:
                  number: 9898
