name: validate

# Validate Kubernetes manifests on every push and PR. No cluster required.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build kustomize output
        run: |
          kubectl kustomize manifests > /tmp/rendered.yaml
          echo "----- rendered manifests -----"
          cat /tmp/rendered.yaml

      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kc.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kc.tar.gz -C /tmp
          sudo install /tmp/kubeconform /usr/local/bin/

      - name: Validate against Kubernetes schemas
        run: |
          kubeconform -strict -summary \
            -kubernetes-version 1.34.0 \
            -schema-location default \
            /tmp/rendered.yaml

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh
